<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VisualPrint AR</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      text-align: center;
    }

    header {
      padding: 18px;
      background: white;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    p {
      margin: 8px 0 0;
      color: #555;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background: #eeeeee;
    }

    .info {
      padding: 20px;
      background: white;
    }
  </style>
</head>

<body>

  <header>
    <h1>VisualPrint</h1>
    <p>Levantamiento Digital · BIM · As Built</p>
  </header>

  <model-viewer
    src="SALA_BOMBEO_PEW.glb"
    alt="Modelo 3D VisualPrint"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    touch-action="pan-y">

    <button slot="ar-button"
      style="
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        padding: 14px 22px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;">
      Ver en Realidad Aumentada
    </button>

  </model-viewer>

  <div class="info">
    <h2>Modelo As Built</h2>
    <p>
      Visualiza una instalación industrial en 3D
      directamente desde tu dispositivo.
    </p>
  </div>

</body>
</html>
